presets:
  - id: ru-banks
    name: Russian banks
    category: Russia
    description: Russian bank websites and payment services from the MIT v2fly catalog and a project-owned seed.
    parts:
      - source: v2fly
        files: [category-bank-ru]
        # Only reviewed bank and payment suffixes. Imported company categories
        # also contain education, mobile, travel and other unrelated properties.
        only: [absolutbank.ru, akbars.ru, alfabank.ru, atb.su, bank.yandex.ru, bspb.ru,
          bystrobank.ru, chelinvest.ru, crediteurope.ru, domrfbank.ru, dvbank.ru,
          gazprombank.ru, gpb.ru, homecredit.ru, metallinvestbank.ru, metib.ru, mkb.ru,
          mtsbank.ru, novikom.ru, nspk.ru, otpbank.ru, psb.ru, psbank.ru, raiffeisen.ru,
          rncb.ru, rosbank.ru, rsb.ru, rshb.ru, sber.ru, sberbank.com, sberbank.ru, sbrf.ru,
          sinara.ru, sngb.ru, sovcombank.ru, tbank-online.com, tbank.ru, tcsbank.ru,
          tinkoff.ru, tkbbank.ru, tochka-tech.com, tochka.com, unicreditbank.ru, uralsib.ru,
          vbrr.ru, vtb.ru, yookassa.ru, yoomoney.ru, zenit.ru]
      - source: local
        files: [ru-banks-extra.txt]

  - id: ru-finance
    name: Russian finance
    category: Russia
    description: Bank of Russia, financial marketplace, and Mir payment services.
    parts:
      - source: local
        files: [ru-finance.txt]

  - id: ru-sber
    name: Sber ecosystem
    category: Russia
    description: Sber services outside the core bank domain.
    parts:
      - source: local
        files: [ru-sber.txt]

  - id: ru-state
    name: Russian government
    category: Russia
    description: Federal and regional government services from v2fly and a project-owned seed.
    # Public registration zones and church properties are not government services.
    exclude_subtrees: [cbg.ru, edu.ru, marine.ru, mospat.ru, patriarchia.ru]
    parts:
      - source: v2fly
        files: [category-gov-ru]
      - source: local
        files: [ru-state-extra.txt]

  - id: ru-social
    name: Russian social media
    category: Russia
    description: Russian social networks, blogs, and messengers.
    exclude: [cdn-vk.ru]
    parts:
      - source: v2fly
        files: [vk, ok, dzen]
      - source: v2fly
        files: [mailru-group]
        # Keep previously supported services without importing the whole holding.
        only: [appsmail.ru, attachmail.ru, bk.ru, boosty.to, donationalerts.com,
          imgsmail.ru, inbox.ru, internet.ru, list.ru, mail.ru, max.ru, mycdn.me,
          sferum.ru, vk-apps.com, vk-apps.ru, vk.company, vk.team, vkgo.app,
          vklive.app, vkvideo.ru, xmail.ru, youla.io, youla.ru]
      - source: local
        files: [ru-social-extra.txt]

  - id: ru-video
    name: Russian video and TV
    category: Russia
    description: Russian video services, TV channels, and cinema sites.
    # Provider-wide CDN suffixes and unrelated music services are not video routes.
    exclude_subtrees: [cdnvideo.ru, cdnvideohub.com, kinescopecdn.net, promodj.com, restream-media.net, rtbcdn.ru, trbcdn.net]
    parts:
      - source: v2fly
        files: [rutube, okko, wink, kinopoisk, category-entertainment-ru]
      - source: local
        files: [ru-video-extra.txt]

  - id: ru-essential
    name: Essential Russian services
    category: Russia
    description: Selected Russian services from operator lists and official sites.
    parts:
      - source: hxehex
        files: [whitelist.txt]
        # An observed SNI does not authorize its whole subtree. Retain only
        # suffixes supported by the earlier catalog and still in these sources.
        only: &essential_suffixes [2gis.ru, aeroflot.ru, aif.ru, auchan.ru, avito.ru,
          avito.st, beeline.ru, citydrive.ru, ctc.ru, dellin.ru, dixy.ru, domashniy.ru,
          duma.gov.ru, dzen.ru, esia.gosuslugi.ru, gazeta.ru, gosuslugi.ru,
          government.ru, hh.ru, ivi.ru, kommersant.ru, kp.ru, kremlin.ru, kuper.ru,
          lenta.ru, magnit.ru, mail.ru, matchtv.ru, max.ru, mchs.gov.ru, megafon.ru,
          metro-cc.ru, mir24.tv, mk.ru, moex.com, mos.ru, mts.ru, mvd.ru, nspk.ru,
          ntv.ru, ok.ru, otr-online.ru, ozon.ru, perekrestok.ru, petrovich.ru,
          pochta.ru, rambler.ru, rbc.ru, rg.ru, ria.ru, rosseti.ru, rt.ru, rutube.ru,
          rzd.ru, samokat.ru, tnt-online.ru, tutu.ru, tv3.ru, tvc.ru, vedomosti.ru,
          vk.com, vkusvill.ru, wb.ru, wildberries.ru, x5.ru, ya.ru, yandex.ru]
      - source: chebur
        files: [moscow-tele2/domains.txt, spb-tele2/domains.txt]
        only: *essential_suffixes
      - source: local
        files: [ru-essential-extra.txt]

  - id: miro
    name: Miro
    category: Work
    description: Miro global production domains.
    parts:
      - source: local
        files: [miro.txt]

  # These entries supplement the matching IDs in the compatibility catalog.
  - id: docker
    name: Docker
    category: Development
    description: Independently verified Docker endpoints.
    parts:
      - source: local
        files: [docker-additions.txt]

  - id: github
    name: GitHub and Copilot
    category: Development
    description: Independently verified GitHub Copilot endpoints.
    parts:
      - source: local
        files: [github-additions.txt]

  - id: openai
    name: OpenAI and ChatGPT
    category: AI
    description: Independently verified ChatGPT endpoints.
    parts:
      - source: local
        files: [openai-additions.txt]
